stages:
  - build
  - deploy

build_artifact:
  image: node:12
  stage: build
  only:
    - master
  script:
    - npm i && npm run electron:build
  artifacts:
    paths:
      - ./dist_electron/
    expire_in: 60 min


deploy_on_test:
  image: ubuntu:19.04
  stage: deploy
  only:
    - master
  before_script:
    - apt-get update && apt-get install jq -y && ls -l
  script:
    - bash -c "ci/deploy.sh"
