name: Version merged release PR

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write

concurrency:
  group: version-on-main
  cancel-in-progress: false

jobs:
  version:
    if: >-
      github.event.pull_request.merged == true &&
      (
        contains(github.event.pull_request.labels.*.name, 'release:major') ||
        contains(github.event.pull_request.labels.*.name, 'release:minor') ||
        contains(github.event.pull_request.labels.*.name, 'release:patch')
      )
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: Select release type
        id: release
        run: |
          node <<'NODE'
          const fs = require('fs');

          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const labels = event.pull_request.labels
            .map(({ name }) => name)
            .filter((name) => ['release:major', 'release:minor', 'release:patch'].includes(name));

          if (labels.length !== 1) {
            const message = labels.length === 0
              ? 'No SemVer release label was selected; versioning is skipped.'
              : `Conflicting SemVer release labels: ${labels.join(', ')}; versioning is skipped.`;
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Release versioning skipped\n\n${message}\n`);
            console.error(message);
            process.exit(1);
          }

          const output = [
            `release_type=${labels[0].slice('release:'.length)}`,
            `expected_sha=${event.pull_request.merge_commit_sha}`,
            `pr_number=${event.pull_request.number}`,
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `${output}\n`);
          NODE

      - name: Check out merged main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Create or recover release version
        id: version
        uses: ./.github/actions/create-release-version
        with:
          release_type: ${{ steps.release.outputs.release_type }}
          expected_sha: ${{ steps.release.outputs.expected_sha }}
          release_identity: pull-request-${{ steps.release.outputs.pr_number }}
          changelog_mode: pull-request
          pr_number: ${{ steps.release.outputs.pr_number }}

  release:
    needs: version
    if: needs.version.outputs.release_tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.version.outputs.release_tag }}
